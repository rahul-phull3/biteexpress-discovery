# SonarQube analysis of this repository: `npm run sonar:scan`
# (the server and the scanner are in docker-compose.sonar.yml; steps in docs/RUNBOOK.md).

sonar.projectKey=biteexpress-discovery
sonar.projectName=BiteExpress discovery API
sonar.sourceEncoding=UTF-8

# Production code: src/, without the unit tests that sit next to it.
sonar.sources=src
sonar.exclusions=**/*.spec.ts

# Test code: the unit tests next to the code, the HTTP and integration tests, and their helpers.
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,test/**/*.ts

# Coverage comes from the unit tests: `npm run test:cov` writes coverage/lcov.info, and
# scripts/sonar/relativize-lcov.mjs makes its paths relative so the scanner container finds the files.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Entry points that only start a process.
sonar.coverage.exclusions=src/main.ts,src/importer/main.ts,src/importer/build-text-fixes.main.ts

# Set to true to make `npm run sonar:scan` fail when the quality gate fails (for CI).
sonar.qualitygate.wait=false
